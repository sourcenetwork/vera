syntax = "proto3";

package sourcehub.acp;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "sourcehub/acp/params.proto";
import "sourcehub/acp/ica_connection.proto";

option go_package = "github.com/sourcenetwork/sourcehub/x/acp/types";

// GenesisState defines the acp module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // ica_connections defines the list of ICA connections.
  repeated ICAConnection ica_connections = 2 [(gogoproto.nullable) = false];
}

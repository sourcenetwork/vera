syntax = "proto3";
package sourcehub.hub;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/sourcenetwork/sourcehub/x/hub/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "sourcehub/x/hub/Params";
  option (gogoproto.equal) = true;

  GenesisParams genesis_params = 1;
}

message GenesisParams {
  // allow_zero_fee_txs if true configures the antee handler
  // to not reject txs with 0 fees
  bool allow_zero_fee_txs = 1;

  // ignore_bearer_auth if true ignores the `authorized_account`
  // field in the Bearer JWS from Extension Options
  bool ignore_bearer_auth = 2;
}
syntax = "proto3";

package sourcehub.bulletin;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "sourcehub/bulletin/params.proto";
import "sourcehub/bulletin/namespace.proto";

option go_package = "github.com/sourcenetwork/sourcehub/x/bulletin/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc CreatePost(MsgCreatePost) returns (MsgCreatePostResponse);
  rpc UpdateRingPostByAcp(MsgUpdateRingPostByAcp) returns (MsgUpdateRingPostByAcpResponse);
  rpc UpdateRingPostByThresholdSignature(MsgUpdateRingPostByThresholdSignature) returns (MsgUpdateRingPostByThresholdSignatureResponse);
  rpc RegisterNamespace(MsgRegisterNamespace) returns (MsgRegisterNamespaceResponse);
  rpc AddCollaborator(MsgAddCollaborator) returns (MsgAddCollaboratorResponse);
  rpc RemoveCollaborator(MsgRemoveCollaborator) returns (MsgRemoveCollaboratorResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sourcehub/x/bulletin/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreatePost {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
  bytes payload = 3;
  string artifact = 5;
}

message MsgCreatePostResponse {}

message MsgUpdateRingPostByAcp {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
  string post_id = 3;
  string artifact = 4;
  repeated string new_peer_ids = 5;
  optional uint32 new_threshold = 6;
  optional uint64 pss_interval = 7;
}

message MsgUpdateRingPostByAcpResponse {}

message MsgUpdateRingPostByThresholdSignature {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
  string post_id = 3;
  string artifact = 4;
  string signature_scheme = 5;
  bytes signature = 6;
}

message MsgUpdateRingPostByThresholdSignatureResponse {}

message RingReshareFinalizeSignDoc {
  string domain = 1;
  string chain_id = 2;
  string namespace = 3;
  string post_id = 4;
  string ring_pk = 5;
  bytes current_payload_sha256 = 6;
  bytes finalized_payload_sha256 = 7;
  uint64 block_number_nonce = 8;
}

message MsgRegisterNamespace {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
}

message MsgRegisterNamespaceResponse {
  Namespace namespace = 1;
}

message MsgAddCollaborator {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
  string collaborator = 3;
}

message MsgAddCollaboratorResponse {
  string collaborator_did = 1;
}

message MsgRemoveCollaborator {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string namespace = 2;
  string collaborator = 3;
}

message MsgRemoveCollaboratorResponse {
  string collaborator_did = 1;
}

syntax = "proto3";
package sourcehub.orbis;

option go_package = "github.com/sourcenetwork/sourcehub/x/orbis/types";

// Document stores an encrypted Orbis document and its policy binding metadata.
message Document {
  string id = 1;
  string namespace = 2;
  string creator_did = 3;
  string ring_id = 4;
  string document = 5;
  string proof = 6;
  string policy_id = 7;
  string resource = 8;
  string permission = 9;
  // Absent means no tier.
  optional string tier = 10;
  // Absent means no timestamp.
  optional uint64 timestamp = 11;
}

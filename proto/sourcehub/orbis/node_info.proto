syntax = "proto3";
package sourcehub.orbis;

option go_package = "github.com/sourcenetwork/sourcehub/x/orbis/types";

// NodeInfo stores access-control metadata for a node participating in Orbis rings.
message NodeInfo {
  string peer_id = 1;
  string controller_key = 2;
  repeated string whitelisted_namespaces = 3;
  repeated string whitelisted_ring_ids = 4;
}

// NodeInfoEntry pairs a node_key with its NodeInfo for genesis export/import.
message NodeInfoEntry {
  string node_key = 1;
  NodeInfo node_info = 2;
}

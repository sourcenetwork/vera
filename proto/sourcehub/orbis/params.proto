syntax = "proto3";
package sourcehub.orbis;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "sourcehub/orbis/ring.proto";

option go_package = "github.com/sourcenetwork/sourcehub/x/orbis/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "sourcehub/x/orbis/Params";
  option (gogoproto.equal) = true;

  DemeritConfig default_demerit_config = 1 [(gogoproto.nullable) = false];
}

syntax = "proto3";

package sourcehub.orbis;

option go_package = "github.com/sourcenetwork/sourcehub/x/orbis/types";

// EventRingCreated is emitted when a ring is created.
message EventRingCreated {
  string namespace = 1;
  string ring_id = 2;
  string creator_did = 3;
  string artifact = 4;
}

// EventRingUpdated is emitted when a ring is updated in place.
message EventRingUpdated {
  string namespace = 1;
  string ring_id = 2;
  string updater_did = 3;
}

// EventDocumentStored is emitted when an encrypted document is stored.
message EventDocumentStored {
  string namespace = 1;
  string document_id = 2;
  string creator_did = 3;
}

// EventKeyDerivationStored is emitted when a key derivation is stored.
message EventKeyDerivationStored {
  string namespace = 1;
  string key_derivation_id = 2;
  string creator_did = 3;
}

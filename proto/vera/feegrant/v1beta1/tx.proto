
syntax = "proto3";
package vera.feegrant.v1beta1;

import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";

option go_package = "github.com/sourcenetwork/vera/x/feegrant";

// Msg defines the feegrant msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // GrantAllowance grants fee allowance to the grantee on the granter's
  // account with the provided expiration time.
  rpc GrantAllowance(MsgGrantAllowance) returns (MsgGrantAllowanceResponse);

  // RevokeAllowance revokes any fee allowance of granter's account that
  // has been granted to the grantee.
  rpc RevokeAllowance(MsgRevokeAllowance) returns (MsgRevokeAllowanceResponse);

  // PruneAllowances prunes expired fee allowances, currently up to 75 at a time.
  rpc PruneAllowances(MsgPruneAllowances) returns (MsgPruneAllowancesResponse) {
    option (cosmos_proto.method_added_in) = "cosmos-sdk v0.50.0";
  };

  // GrantDIDAllowance grants fee allowance to a DID on the granter's account.
  rpc GrantDIDAllowance(MsgGrantDIDAllowance) returns (MsgGrantDIDAllowanceResponse);

  // ExpireDIDAllowance expires a fee allowance by setting the expiration to current PeriodReset.
  // This allows the allowance to be automatically pruned when the current period expires.
  rpc ExpireDIDAllowance(MsgExpireDIDAllowance) returns (MsgExpireDIDAllowanceResponse);

  // PruneDIDAllowances prunes expired DID fee allowances, currently up to 75 at a time.
  rpc PruneDIDAllowances(MsgPruneDIDAllowances) returns (MsgPruneDIDAllowancesResponse);
}

// MsgGrantAllowance adds permission for Grantee to spend up to Allowance
// of fees from the account of Granter.
message MsgGrantAllowance {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name)           = "cosmos-sdk/MsgGrantAllowance";
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee is the address of the user being granted an allowance of another user's funds.
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // allowance can be any of basic, periodic, allowed fee allowance.
  google.protobuf.Any allowance = 3 [(cosmos_proto.accepts_interface) = "vera.feegrant.v1beta1.FeeAllowanceI"];
}

// MsgGrantAllowanceResponse defines the Msg/GrantAllowanceResponse response type.
message MsgGrantAllowanceResponse {}

// MsgRevokeAllowance removes any existing Allowance from Granter to Grantee.
message MsgRevokeAllowance {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name)           = "cosmos-sdk/MsgRevokeAllowance";
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee is the address of the user being granted an allowance of another user's funds.
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRevokeAllowanceResponse defines the Msg/RevokeAllowanceResponse response type.
message MsgRevokeAllowanceResponse {}

// MsgPruneAllowances prunes expired fee allowances.
message MsgPruneAllowances {
  option (cosmos.msg.v1.signer)          = "pruner";
  option (cosmos_proto.message_added_in) = "cosmos-sdk v0.50";
  // pruner is the address of the user pruning expired allowances.
  string pruner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgPruneAllowancesResponse defines the Msg/PruneAllowancesResponse response type.
message MsgPruneAllowancesResponse {
  option (cosmos_proto.message_added_in) = "cosmos-sdk v0.50";
}

// MsgGrantDIDAllowance adds permission for a DID to spend up to Allowance
// of fees from the account of Granter.
message MsgGrantDIDAllowance {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name)           = "vera/MsgGrantDIDAllowance";
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee_did is the DID being granted an allowance of another user's funds.
  string grantee_did = 2;
  // allowance can be any of basic, periodic, allowed fee allowance.
  google.protobuf.Any allowance = 3 [(cosmos_proto.accepts_interface) = "vera.feegrant.v1beta1.FeeAllowanceI"];
}

// MsgGrantDIDAllowanceResponse defines the Msg/GrantDIDAllowanceResponse response type.
message MsgGrantDIDAllowanceResponse {}

// MsgExpireDIDAllowance expires an existing DID allowance by setting the expiration to current PeriodReset.
message MsgExpireDIDAllowance {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name)           = "vera/MsgExpireDIDAllowance";
  // granter is the address of the user who granted the allowance.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee_did is the DID whose allowance should be expired.
  string grantee_did = 2;
}

// MsgExpireDIDAllowanceResponse defines the Msg/ExpireDIDAllowanceResponse response type.
message MsgExpireDIDAllowanceResponse {}

// EventGrantDIDAllowance is emitted when a DID allowance is granted.
message EventGrantDIDAllowance {
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1;
  // grantee_did is the DID being granted an allowance of another user's funds.
  string grantee_did = 2;
}

// EventExpireDIDAllowance is emitted when a DID allowance is expired.
message EventExpireDIDAllowance {
  // granter is the address of the user expiring an allowance of their funds.
  string granter = 1;
  // grantee_did is the DID whose allowance is being expired.
  string grantee_did = 2;
}

// MsgPruneDIDAllowances prunes expired DID fee allowances.
message MsgPruneDIDAllowances {
  option (cosmos.msg.v1.signer) = "pruner";
  // pruner is the address of the user pruning expired DID allowances.
  string pruner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgPruneDIDAllowancesResponse defines the Msg/PruneDIDAllowancesResponse response type.
message MsgPruneDIDAllowancesResponse {}

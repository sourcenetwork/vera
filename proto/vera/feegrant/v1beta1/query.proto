syntax = "proto3";
package vera.feegrant.v1beta1;

import "vera/feegrant/v1beta1/feegrant.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/sourcenetwork/vera/x/feegrant";

// Query defines the gRPC querier service.
service Query {

  // Allowance returns granted allowance to the grantee by the granter.
  rpc Allowance(QueryAllowanceRequest) returns (QueryAllowanceResponse) {
    option (google.api.http).get = "/vera/feegrant/v1beta1/allowance/{granter}/{grantee}";
  }

  // Allowances returns all the grants for the given grantee address.
  rpc Allowances(QueryAllowancesRequest) returns (QueryAllowancesResponse) {
    option (google.api.http).get = "/vera/feegrant/v1beta1/allowances/{grantee}";
  }

  // AllowancesByGranter returns all the grants given by an address.
  rpc AllowancesByGranter(QueryAllowancesByGranterRequest) returns (QueryAllowancesByGranterResponse) {
    option (google.api.http).get          = "/vera/feegrant/v1beta1/issued/{granter}";
    option (cosmos_proto.method_added_in) = "cosmos-sdk 0.46";
  }

  // DIDAllowance returns granted allowance to the DID by the granter.
  rpc DIDAllowance(QueryDIDAllowanceRequest) returns (QueryDIDAllowanceResponse) {
    option (google.api.http).get = "/vera/feegrant/v1beta1/did_allowance/{granter}/{grantee_did}";
  }

  // DIDAllowances returns all the DID grants for the given grantee DID.
  rpc DIDAllowances(QueryDIDAllowancesRequest) returns (QueryDIDAllowancesResponse) {
    option (google.api.http).get = "/vera/feegrant/v1beta1/did_allowances/{grantee_did}";
  }

  // DIDAllowancesByGranter returns all the DID grants given by an address.
  rpc DIDAllowancesByGranter(QueryDIDAllowancesByGranterRequest) returns (QueryDIDAllowancesByGranterResponse) {
    option (google.api.http).get = "/vera/feegrant/v1beta1/did_issued/{granter}";
  }
}

// QueryAllowanceRequest is the request type for the Query/Allowance RPC method.
message QueryAllowanceRequest {
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // grantee is the address of the user being granted an allowance of another user's funds.
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryAllowanceResponse is the response type for the Query/Allowance RPC method.
message QueryAllowanceResponse {
  // allowance is an allowance granted for grantee by granter.
  vera.feegrant.v1beta1.Grant allowance = 1;
}

// QueryAllowancesRequest is the request type for the Query/Allowances RPC method.
message QueryAllowancesRequest {
  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // pagination defines a pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryAllowancesResponse is the response type for the Query/Allowances RPC method.
message QueryAllowancesResponse {
  // allowances are allowance's granted for grantee by granter.
  repeated vera.feegrant.v1beta1.Grant allowances = 1;

  // pagination defines a pagination for the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAllowancesByGranterRequest is the request type for the Query/AllowancesByGranter RPC method.
message QueryAllowancesByGranterRequest {
  option (cosmos_proto.message_added_in) = "cosmos-sdk 0.46";
  string granter                         = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // pagination defines a pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryAllowancesByGranterResponse is the response type for the Query/AllowancesByGranter RPC method.
message QueryAllowancesByGranterResponse {
  option (cosmos_proto.message_added_in) = "cosmos-sdk 0.46";
  // allowances that have been issued by the granter.
  repeated vera.feegrant.v1beta1.Grant allowances = 1;

  // pagination defines a pagination for the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryDIDAllowanceRequest is the request type for the Query/DIDAllowance RPC method.
message QueryDIDAllowanceRequest {
  // granter is the address of the user granting an allowance of their funds.
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // grantee_did is the DID being granted an allowance of another user's funds.
  string grantee_did = 2;
}

// QueryDIDAllowanceResponse is the response type for the Query/DIDAllowance RPC method.
message QueryDIDAllowanceResponse {
  // allowance is an allowance granted for DID by granter.
  vera.feegrant.v1beta1.Grant allowance = 1;
}

// QueryDIDAllowancesRequest is the request type for the Query/DIDAllowances RPC method.
message QueryDIDAllowancesRequest {
  // grantee_did is the DID being granted allowances.
  string grantee_did = 1;

  // pagination defines a pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryDIDAllowancesResponse is the response type for the Query/DIDAllowances RPC method.
message QueryDIDAllowancesResponse {
  // allowances are DID allowances granted for the grantee DID.
  repeated vera.feegrant.v1beta1.Grant allowances = 1;

  // pagination defines a pagination for the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryDIDAllowancesByGranterRequest is the request type for the Query/DIDAllowancesByGranter RPC method.
message QueryDIDAllowancesByGranterRequest {
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // pagination defines a pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryDIDAllowancesByGranterResponse is the response type for the Query/DIDAllowancesByGranter RPC method.
message QueryDIDAllowancesByGranterResponse {
  // allowances that have been issued by the granter to DIDs.
  repeated vera.feegrant.v1beta1.Grant allowances = 1;

  // pagination defines a pagination for the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
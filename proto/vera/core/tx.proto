syntax = "proto3";
package vera.core;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "vera/core/params.proto";

option go_package = "github.com/sourcenetwork/vera/x/core/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // InvalidateJWS allows a user to manually invalidate a JWS token
  // that they own (same DID) or are authorized to use (same creator account).
  rpc InvalidateJWS(MsgInvalidateJWS) returns (MsgInvalidateJWSResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "vera/x/core/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgInvalidateJWS is the Msg/InvalidateJWS request type.
// This message allows a user to invalidate a JWS token:
// - By providing a JWS extension option with matching DID.
// - By being the creator/signer of the message with matching authorized account.
message MsgInvalidateJWS {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "vera/x/core/MsgInvalidateJWS";
  // creator is the address of the message signer.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // token_hash is the hash/identifier of the JWS token to invalidate.
  string token_hash = 2;
}

// MsgInvalidateJWSResponse defines the response structure for executing a MsgInvalidateJWS message.
message MsgInvalidateJWSResponse {
  // success indicates whether the invalidation was successful.
  bool success = 1;
}

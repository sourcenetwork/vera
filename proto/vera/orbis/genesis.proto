syntax = "proto3";
package vera.orbis;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "vera/orbis/document.proto";
import "vera/orbis/key_derivation.proto";
import "vera/orbis/node_info.proto";
import "vera/orbis/params.proto";
import "vera/orbis/ring.proto";

option go_package = "github.com/sourcenetwork/vera/x/orbis/types";

// GenesisState defines the orbis module's genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Ring rings = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Document documents = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated KeyDerivation key_derivations = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated NodeInfoEntry node_infos = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated NodeDemeritEntry node_demerits = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated AcceptedReportPairEntry accepted_report_pairs = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// NodeDemeritEntry pairs a ring/node demerit score with its reset window.
message NodeDemeritEntry {
  string ring_id = 1;
  string node_key = 2;
  uint64 points = 3;
  uint64 window_started_at = 4;
}

// AcceptedReportPairEntry records a replay-protection pair that must always be stored together.
message AcceptedReportPairEntry {
  string report_id = 1;
  string session_id = 2;
  uint64 expires_at = 3;
}

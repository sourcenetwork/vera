syntax = "proto3";
package vera.orbis;

option go_package = "github.com/sourcenetwork/vera/x/orbis/types";

// Document stores an encrypted Orbis document and its policy binding metadata.
message Document {
  string id = 1;
  string creator_did = 2;
  string ring_id = 3;
  string document = 4;
  string proof = 5;
  string policy_id = 6;
  string resource = 7;
  string permission = 8;
  // Absent means no tier.
  optional string tier = 9;
  // Absent means no timestamp.
  optional uint64 timestamp = 10;
}
